name: Build Windows package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Check settings XAML contracts
        run: python3 build/check-settings-xaml.py
      - name: Test motion, shape, and state logic
        run: dotnet test tests/DynamicIsland.Core.Tests/DynamicIsland.Core.Tests.csproj -c Release

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run managed caption and shutdown stress regressions on Windows
        run: dotnet test tests/DynamicIsland.Core.Tests/DynamicIsland.Core.Tests.csproj -c Release
      - name: Compile embedded glass GPU shaders
        shell: pwsh
        run: ./build/check-glass-shader.ps1
      - name: Validate D3D11 shader pixels with headless WARP (not hardware FPS)
        run: dotnet run --project tools/GlassGpuCheck/GlassGpuCheck.csproj -c Release --property:WarningLevel=9999 --property:TreatWarningsAsErrors=true
      - name: Load actual WPF settings resources, layout and behavior (headless)
        run: dotnet run --project tools/SettingsUiCheck/SettingsUiCheck.csproj -c Release --property:TreatWarningsAsErrors=true
      - name: Probe under-island capture APIs on a synthetic stacked window (not a user-desktop proof)
        run: dotnet run --project tools/GlassUnderlayCheck/GlassUnderlayCheck.csproj -c Release --property:TreatWarningsAsErrors=true
      - name: Publish self-contained exe
        shell: bash
        run: ./build/publish.sh "${{ runner.temp }}/publish"
      - name: Zip
        shell: pwsh
        run: |
          $publish = "${{ runner.temp }}/publish"
          Copy-Item packaging/使用说明.txt "$publish/readme.txt"
          if (-not (Test-Path "$publish/runtimes/win-x64/whisper.dll")) {
            throw "whisper.dll was not copied beside the published exe."
          }
          # Whisper.net looks for natives at ./runtimes/win-x64 next to the exe.
          # The single-file exe does not extract those files there, so the folder must ship in the zip.
          Compress-Archive -Path "$publish/DynamicIsland.exe","$publish/readme.txt","$publish/runtimes" -DestinationPath DynamicIsland-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-win-x64
          path: DynamicIsland-win-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DynamicIsland-win-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: DynamicIsland-win-x64.zip
